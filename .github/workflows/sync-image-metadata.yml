name: Sync image metadata

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/content/blog/**/*.mdx'
      - 'scripts/sync-image-metadata.mjs'
      - 'package.json'
      - 'bun.lock'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-image-metadata-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json

      - name: Install dependencies
        run: npm install

      - name: Sync image metadata
        id: metadata
        run: |
          set -o pipefail
          npm run sync:image-metadata | tee /tmp/image-metadata.log
          summary=$(sed -n 's/^Image metadata synced: //p' /tmp/image-metadata.log | tail -n 1)
          updated=$(node -e "const summary = JSON.parse(process.argv[1]); console.log(summary.updated || 0)" "$summary")
          echo "updated=$updated" >> "$GITHUB_OUTPUT"
          if git diff --quiet -- data/image-metadata.sqlite src/generated/image-metadata.ts; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Image metadata files are already current."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Image metadata files changed after sync."
            echo "Fetched metadata for $updated new image(s)."
          fi

      - name: Create pull request
        if: steps.metadata.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          add-paths: |
            data/image-metadata.sqlite
            src/generated/image-metadata.ts
          branch: automation/sync-image-metadata
          commit-message: 'chore: sync image metadata'
          delete-branch: true
          labels: |
            automated
            image-metadata
          title: 'chore: sync image metadata'
          body: |
            Updates the generated image metadata cache after content changes.

            This PR is generated by `.github/workflows/sync-image-metadata.yml`.
